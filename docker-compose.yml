services:
  # =========================================================================
  # Caddy Reverse Proxy (Gère les domaines, SSL, et route le trafic)
  # =========================================================================
# [edge] service caddy deplace vers /opt/edge :
#  caddy:
#    image: caddy:2-alpine
#    container_name: jt-alwm-caddy
#    restart: unless-stopped
#    ports:
#      - "80:80"
#      - "443:443"
#      - "443:443/udp"   # HTTP/3 (QUIC)
#    volumes:
#      - ./Caddyfile:/etc/caddy/Caddyfile
#      - caddy_data:/data
#      - caddy_config:/config
#      - uploads_volume:/app/uploads
#    networks:
#      - jt-alwm-network
#    depends_on:
#      - frontend
#      - backend
#
#  # =========================================================================
#  # Backend Service - Node.js Express API
#  # =========================================================================
  backend:
    container_name: jt-alwm-backend
    mem_limit: 512m
    cpus: 1.0
    build:
      # Racine du dépôt : le backend embarque remotion/src/identite.js.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3010
      # Origine publique (domaine Caddy). Évite CORS=* (rejeté par les
      # navigateurs avec credentials, et trop permissif).
      - CORS_ORIGIN=${CORS_ORIGIN:-https://jt-alwm-team.duckdns.org}
      - RENDERER=remotion
      - RENDER_WORKER_URL=http://worker:8080
      # Secret partagé backend↔worker — JAMAIS en dur. Défini dans .env
      # (générer : openssl rand -hex 32). Fail si vide.
      - WORKER_KEY=${WORKER_KEY:?WORKER_KEY requis dans .env}
      - PUBLIC_API_URL=http://backend:3010
      - GLOBAL_PASSWORD=${GLOBAL_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Signature des liens personnels de correspondants. Facultatif : sans
      # lui, aucun envoi n'est attribué et la plateforme fonctionne comme
      # avant. Le changer révoque tous les liens distribués.
      - REPORTER_TOKEN_SECRET=${REPORTER_TOKEN_SECRET}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
    volumes:
      - uploads_volume:/app/uploads
    networks:
      - jt-alwm-network
    ports:
      - "3010:3010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # Frontend Service - React + Vite served by Nginx
  # =========================================================================
  frontend:
    container_name: jt-alwm-frontend
    mem_limit: 256m
    cpus: 0.5
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks:
      - jt-alwm-network
    ports:
      - "3003:80"
    restart: unless-stopped
    healthcheck:
      # FIX: utilise 127.0.0.1 au lieu de localhost pour forcer IPv4
      # (Alpine wget résout localhost en IPv6 ::1, nginx écoute sur 0.0.0.0)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # =========================================================================
  # Worker Service - Moteur de rendu Remotion/Puppeteer
  # =========================================================================
  worker:
    container_name: jt-alwm-worker
    mem_limit: 2g
    cpus: 2.0
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - PORT=8080
      - WORKER_KEY=${WORKER_KEY:?WORKER_KEY requis dans .env}
    networks:
      - jt-alwm-network
    volumes:
      - uploads_volume:/app/uploads
    shm_size: "2gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================================================
# Volumes for persistent data
# ============================================================================
volumes:
  uploads_volume:
    driver: local
  caddy_data:
  caddy_config:

# ============================================================================
# Networks for service communication
# ============================================================================
networks:
  jt-alwm-network:
    driver: bridge
